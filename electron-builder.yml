appId: com.sadguru.roconnect
productName: Sadguru RO Connect
copyright: Copyright © 2026 Sadguru Enterprise

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# node:sqlite is built in, so there are no native modules to rebuild or unpack.
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sadguru RO Connect
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}
